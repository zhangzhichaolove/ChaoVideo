plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.app.chao.chaoapp'
    compileSdk = 37
    defaultConfig {
        applicationId = 'com.app.chao.chaoapp'
        minSdk = 23
        targetSdk = 37
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = project.hasProperty('platformReleaseSmoke')
                ? 'com.app.chao.chaoapp.playback.ReleasePlaybackInstrumentation'
                : 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable += 'NotificationPermission'
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test.resources.srcDir 'schemas'
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}


apply from: rootProject.file('gradle/release-config.gradle')

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    // Match the Media3 version used by the GSY ExoPlayer integration.
    //noinspection GradleDependency
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    //noinspection GradleDependency
    implementation 'androidx.media3:media3-ui:1.10.0'
    //noinspection GradleDependency
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.0'
    //noinspection GradleDependency
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.0'
//    androidTestCompile('androidx.test.espresso:espresso-core:3.1.0', {
//        exclude group: 'com.android.support', module: 'support-annotations'
//    })
    //compile 'com.android.support:support-v4:+'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    //compile 'com.android.support.constraint:constraint-layout:1.0.2'
    //testCompile 'junit:junit:4.12'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:3.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    //compile 'fm.jiecao:jiecaovideoplayer:4.7.1_preview'

    //compile 'fm.jiecao:jiecaovideoplayer:4.8.3'
    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-java:v12.1.0'
    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-exo2:v12.1.0'
}
