plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.app.chao.chaoapp'
    compileSdk = 37
    defaultConfig {
        applicationId = 'com.app.chao.chaoapp'
        minSdk = 23
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
        disable += 'NotificationPermission'
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
//    androidTestCompile('androidx.test.espresso:espresso-core:3.1.0', {
//        exclude group: 'com.android.support', module: 'support-annotations'
//    })
    //compile 'com.android.support:support-v4:+'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.cjj.materialrefeshlayout:library:1.3.0'
    //compile 'com.android.support.constraint:constraint-layout:1.0.2'
    //testCompile 'junit:junit:4.12'
    implementation 'io.reactivex:rxjava:1.2.6'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'com.google.dagger:dagger:2.57.2'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.57.2'
    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.4.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:2.1.0'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'com.jude:easyrecyclerview:4.0.6'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.jude:rollviewpager:1.4.5'
    //compile 'fm.jiecao:jiecaovideoplayer:4.7.1_preview'

    implementation 'fm.jiecao:jiecaovideoplayer:5.5.2'
    //compile 'fm.jiecao:jiecaovideoplayer:4.8.3'
    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-java:v12.1.0'
    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-exo2:v12.1.0'
    implementation 'org.simple:androideventbus:1.0.5.1'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    annotationProcessor("javax.annotation:javax.annotation-api:1.3.2")
}
